<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>CampusMind - AI Student Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
  <style>
    body {
      margin: 0;
      background-color: #F4F7FB;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #loading-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F4F7FB;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    .loading-card {
      background: #FFFFFF;
      padding: 2.2rem 2.8rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      border: 1px solid #E2E8F0;
      text-align: center;
      max-width: 440px;
      width: 90%;
    }
    .loading-icon {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      animation: bounce 1.8s infinite ease-in-out;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .loading-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1E293B;
      margin-bottom: 0.25rem;
    }
    .loading-subtitle {
      font-size: 0.88rem;
      color: #64748B;
      margin-bottom: 1.5rem;
    }
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #EEF2FF;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .progress-bar-fill {
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #4F46E5, #14B8A6);
      border-radius: 999px;
      animation: indeterminate 1.8s infinite ease-in-out;
    }
    @keyframes indeterminate {
      0% { transform: translateX(-100%); width: 30%; }
      50% { transform: translateX(50%); width: 60%; }
      100% { transform: translateX(300%); width: 30%; }
    }
    .loading-status {
      font-size: 0.82rem;
      color: #4F46E5;
      font-weight: 600;
      min-height: 1.2rem;
    }
    .loading-note {
      font-size: 0.75rem;
      color: #94A3B8;
      margin-top: 0.6rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";

    const statusEl = document.getElementById("loading-status");
    const loaderEl = document.getElementById("loading-screen");

    const appFiles = {"app.py": "import streamlit as st\nfrom pathlib import Path\nfrom modules import agent_rules, navigator, game_zone, comfort, insights\n\n# Vercel Serverless runtime compatibility exports\ndef app(environ, start_response):\n    start_response(\"200 OK\", [(\"Content-Type\", \"text/plain\")])\n    return [b\"CampusMind is running.\"]\napplication = app\nhandler = app\n\nst.set_page_config(\n    page_title=\"CampusMind - AI Academic Assistant\",\n    page_icon=\"\ud83c\udf93\",\n    layout=\"wide\",\n    initial_sidebar_state=\"expanded\"\n)\n\ndef load_css():\n    \"\"\"Inject custom CSS from style.css for consistent dashboard aesthetics.\"\"\"\n    css_path = Path(\"style.css\")\n    if css_path.exists():\n        st.markdown(f\"<style>{css_path.read_text(encoding='utf-8')}</style>\", unsafe_allow_html=True)\n\nload_css()\n\n# Left Sidebar Navigation\nwith st.sidebar:\n    st.markdown('<div style=\"display:flex; align-items:center; gap:0.6rem; margin-bottom:1.2rem;\">'\n                '<span style=\"font-size:2rem;\">\ud83c\udf93</span>'\n                '<div><div style=\"font-size:1.35rem; font-weight:700; color:#1E293B;\">CampusMind</div>'\n                '<div style=\"font-size:0.8rem; color:#64748B;\">AI Student Dashboard</div></div>'\n                '</div>', unsafe_allow_html=True)\n    \n    menu_options = [\n        \"\ud83e\udd16 Agent & Rules\",\n        \"\ud83e\udded Navigator\",\n        \"\ud83c\udfae Game Zone\",\n        \"\u2744\ufe0f Comfort Control\",\n        \"\ud83d\udcca Student Insights\"\n    ]\n    \n    choice = st.radio(\"Navigation Menu\", menu_options, label_visibility=\"collapsed\")\n    \n    st.markdown(\"<hr style='margin: 1.5rem 0; border-color:#E2E8F0;'>\", unsafe_allow_html=True)\n    st.markdown('<div style=\"font-size:0.78rem; color:#94A3B8; line-height:1.5;\">'\n                'CampusMind showcases 10 fundamental AI practical techniques within a clean, student-friendly interface.'\n                '</div>', unsafe_allow_html=True)\n\n# Top Bar Header\nclean_title = choice.split(\" \", 1)[1] if \" \" in choice else choice\nst.markdown(f'<div class=\"top-header\">'\n            f'<h1 class=\"top-title\">{choice}</h1>'\n            f'<div class=\"top-badge\">\u26a1 Powered by 10 AI techniques</div>'\n            f'</div>', unsafe_allow_html=True)\n\n# Main Screen Dispatcher\nif \"Agent & Rules\" in choice:\n    agent_rules.run()\nelif \"Navigator\" in choice:\n    navigator.run()\nelif \"Game Zone\" in choice:\n    game_zone.run()\nelif \"Comfort Control\" in choice:\n    comfort.run()\nelif \"Student Insights\" in choice:\n    insights.run()\n", "style.css": "@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');\n\nhtml, body, [class*=\"css\"] {\n    font-family: 'Inter', sans-serif;\n    color: #1E293B;\n}\n\n/* Background */\n.stApp {\n    background-color: #F4F7FB;\n}\n\n/* Header Banner */\n.top-header {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    padding: 0.6rem 0rem 1.2rem 0rem;\n    margin-bottom: 0.5rem;\n    border-bottom: 1px solid #E2E8F0;\n}\n\n.top-title {\n    font-size: 1.55rem;\n    font-weight: 700;\n    color: #1E293B;\n    margin: 0;\n}\n\n.top-badge {\n    background: #EEF2FF;\n    color: #4F46E5;\n    border: 1px solid #C7D2FE;\n    padding: 0.35rem 0.8rem;\n    border-radius: 9999px;\n    font-size: 0.82rem;\n    font-weight: 600;\n    display: inline-flex;\n    align-items: center;\n    gap: 0.35rem;\n}\n\n/* Cards */\n.campus-card {\n    background: #FFFFFF;\n    border-radius: 12px;\n    padding: 1.35rem;\n    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);\n    border: 1px solid #E2E8F0;\n    margin-bottom: 1.25rem;\n}\n\n.card-title {\n    font-size: 1.1rem;\n    font-weight: 600;\n    color: #0F172A;\n    margin-bottom: 0.75rem;\n    display: flex;\n    align-items: center;\n    gap: 0.5rem;\n}\n\n.card-subtitle {\n    font-size: 0.85rem;\n    color: #64748B;\n    margin-top: -0.4rem;\n    margin-bottom: 1rem;\n}\n\n/* PEAS Boxes */\n.peas-box {\n    background: #F8FAFC;\n    border: 1px solid #E2E8F0;\n    border-radius: 10px;\n    padding: 1rem;\n    height: 100%;\n}\n\n.peas-label {\n    font-size: 0.82rem;\n    font-weight: 700;\n    text-transform: uppercase;\n    letter-spacing: 0.05em;\n    color: #4F46E5;\n    margin-bottom: 0.35rem;\n}\n\n.peas-text {\n    font-size: 0.9rem;\n    color: #334155;\n    line-height: 1.45;\n}\n\n/* Chips and Badges */\n.chip {\n    display: inline-block;\n    padding: 0.35rem 0.75rem;\n    border-radius: 9999px;\n    font-size: 0.85rem;\n    font-weight: 600;\n    margin: 0.2rem 0.25rem 0.2rem 0;\n}\n\n.chip-green {\n    background: #DEF7EC;\n    color: #03543F;\n    border: 1px solid #BCF0DA;\n}\n\n.chip-red {\n    background: #FDE8E8;\n    color: #9B1C1C;\n    border: 1px solid #FBD5D5;\n}\n\n.chip-amber {\n    background: #FEF3C7;\n    color: #92400E;\n    border: 1px solid #FDE68A;\n}\n\n.chip-indigo {\n    background: #EEF2FF;\n    color: #4F46E5;\n    border: 1px solid #C7D2FE;\n}\n\n.chip-teal {\n    background: #CCFBF1;\n    color: #0F766E;\n    border: 1px solid #99F6E4;\n}\n\n.route-container {\n    display: flex;\n    flex-wrap: wrap;\n    align-items: center;\n    gap: 0.4rem;\n    margin: 0.8rem 0;\n}\n\n.arrow-separator {\n    color: #94A3B8;\n    font-weight: 700;\n    font-size: 1.1rem;\n}\n\n/* Game boards */\n.tile-box {\n    background: #EEF2FF;\n    color: #4F46E5;\n    font-size: 1.35rem;\n    font-weight: 700;\n    border-radius: 8px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    height: 58px;\n    border: 1px solid #C7D2FE;\n}\n\n.tile-empty {\n    background: #F1F5F9;\n    border: 1px dashed #CBD5E1;\n    height: 58px;\n    border-radius: 8px;\n}\n\n/* Gauge Card */\n.gauge-card {\n    text-align: center;\n    padding: 1rem;\n    background: linear-gradient(180deg, #F8FAFC 0%, #FFFFFF 100%);\n    border-radius: 12px;\n    border: 1px solid #E2E8F0;\n}\n\n.gauge-val {\n    font-size: 2.5rem;\n    font-weight: 800;\n    color: #4F46E5;\n}\n\n/* Streamlit Button Tweaks */\ndiv.stButton > button {\n    border-radius: 8px;\n    font-weight: 600;\n    border: 1px solid #E2E8F0;\n    transition: all 0.2s ease;\n}\n\ndiv.stButton > button:hover {\n    border-color: #4F46E5;\n    color: #4F46E5;\n}\n\n/* Primary Button */\ndiv.stButton > button[kind=\"primary\"] {\n    background-color: #4F46E5;\n    color: white;\n    border: none;\n}\ndiv.stButton > button[kind=\"primary\"]:hover {\n    background-color: #4338CA;\n    color: white;\n}\n", "rules.pl": "% CampusMind - Student Eligibility Knowledge Base\n% Rule: A student is eligible if attendance is at least 75% and CGPA is at least 6.5\neligible(Student) :-\n    attendance(Student, Att),\n    cgpa(Student, Cgpa),\n    Att >= 75,\n    Cgpa >= 6.5.\n\n% Sample student facts: attendance (percentage), cgpa (scale 0-10)\nattendance(aarav, 85).\ncgpa(aarav, 8.2).\n\nattendance(diya, 72).\ncgpa(diya, 7.8).\n\nattendance(rohan, 90).\ncgpa(rohan, 6.1).\n\nattendance(ananya, 78).\ncgpa(ananya, 7.0).\n", "modules/__init__.py": "# CampusMind AI Modules Package\n", "modules/agent_rules.py": "import streamlit as st\n\nSTUDENTS = {\n    \"Aarav Sharma\": {\"attendance\": 85, \"cgpa\": 8.2},\n    \"Diya Patel\": {\"attendance\": 72, \"cgpa\": 7.8},\n    \"Rohan Verma\": {\"attendance\": 90, \"cgpa\": 6.1},\n    \"Ananya Iyer\": {\"attendance\": 78, \"cgpa\": 7.0},\n}\n\ndef check_eligibility(att: float, cgpa: float) -> tuple[bool, str]:\n    \"\"\"Evaluate eligibility using Prolog rule: attendance >= 75 and cgpa >= 6.5.\"\"\"\n    if att >= 75 and cgpa >= 6.5:\n        return True, f\"Eligible (Attendance: {att}%, CGPA: {cgpa})\"\n    reasons = []\n    if att < 75:\n        reasons.append(f\"Attendance {att}% < 75%\")\n    if cgpa < 6.5:\n        reasons.append(f\"CGPA {cgpa} < 6.5\")\n    return False, f\"Not Eligible: {', '.join(reasons)}\"\n\ndef run():\n    \"\"\"Render the Agent PEAS framework and Prolog rule eligibility interface.\"\"\"\n    st.markdown('<div class=\"campus-card\">'\n                '<div class=\"card-title\">\ud83e\udd16 Practical 1: PEAS Campus Assistant Agent</div>'\n                '<div class=\"card-subtitle\">Formal specification: Performance, Environment, Actuators & Sensors</div>',\n                unsafe_allow_html=True)\n    c1, c2, c3, c4 = st.columns(4)\n    c1.markdown('<div class=\"peas-box\"><div class=\"peas-label\">Performance</div>'\n                '<div class=\"peas-text\">High GPA success, timely task alerts, 95%+ query accuracy</div></div>', unsafe_allow_html=True)\n    c2.markdown('<div class=\"peas-box\"><div class=\"peas-label\">Environment</div>'\n                '<div class=\"peas-text\">Campus portal, lecture halls, library LMS, student union</div></div>', unsafe_allow_html=True)\n    c3.markdown('<div class=\"peas-box\"><div class=\"peas-label\">Actuators</div>'\n                '<div class=\"peas-text\">Push notifications, calendar invites, automated advisories</div></div>', unsafe_allow_html=True)\n    c4.markdown('<div class=\"peas-box\"><div class=\"peas-label\">Sensors</div>'\n                '<div class=\"peas-text\">Attendance card scans, LMS exam marks feed, user queries</div></div>', unsafe_allow_html=True)\n    st.markdown('</div>', unsafe_allow_html=True)\n\n    st.markdown('<div class=\"campus-card\">'\n                '<div class=\"card-title\">\ud83d\udcdc Practical 2: Prolog Knowledge Base Eligibility</div>'\n                '<div class=\"card-subtitle\">Evaluates rule: attendance >= 75% AND CGPA >= 6.5 (mirrored from rules.pl)</div>',\n                unsafe_allow_html=True)\n    col_left, col_right = st.columns([1, 1])\n    with col_left:\n        name = st.selectbox(\"Select Student\", list(STUDENTS.keys()))\n        s = STUDENTS[name]\n        st.write(f\"\ud83d\udcca **Attendance:** {s['attendance']}% | **CGPA:** {s['cgpa']}\")\n        if st.button(\"Check Eligibility\", type=\"primary\"):\n            ok, msg = check_eligibility(s['attendance'], s['cgpa'])\n            cls = \"chip-green\" if ok else \"chip-red\"\n            st.markdown(f'<span class=\"chip {cls}\">\u25cf {msg}</span>', unsafe_allow_html=True)\n    with col_right:\n        try:\n            with open(\"rules.pl\", \"r\") as f:\n                st.code(f.read(), language=\"prolog\")\n        except FileNotFoundError:\n            st.info(\"rules.pl not found.\")\n    st.markdown('</div>', unsafe_allow_html=True)\n", "modules/navigator.py": "import streamlit as st\nfrom collections import deque\n\nGRAPH = {\n    \"Main Gate\": [\"Admin Block\", \"Library\"],\n    \"Admin Block\": [\"Main Gate\", \"Canteen\", \"Auditorium\"],\n    \"Library\": [\"Main Gate\", \"Lab\", \"Placement Cell\"],\n    \"Canteen\": [\"Admin Block\"],\n    \"Auditorium\": [\"Admin Block\"],\n    \"Lab\": [\"Library\"],\n    \"Placement Cell\": [\"Library\"],\n}\n\ndef bfs(start: str, goal: str) -> list[str]:\n    \"\"\"Find the shortest path between start and goal using Breadth-First Search.\"\"\"\n    queue, visited = deque([[start]]), {start}\n    while queue:\n        path = queue.popleft()\n        if path[-1] == goal:\n            return path\n        for nbr in GRAPH.get(path[-1], []):\n            if nbr not in visited:\n                visited.add(nbr)\n                queue.append(path + [nbr])\n    return []\n\ndef dfs(start: str, goal: str) -> list[str]:\n    \"\"\"Find a path between start and goal using Depth-First Search.\"\"\"\n    stack, visited = [[start]], set()\n    while stack:\n        path = stack.pop()\n        node = path[-1]\n        if node == goal:\n            return path\n        if node not in visited:\n            visited.add(node)\n            for nbr in reversed(GRAPH.get(node, [])):\n                if nbr not in visited:\n                    stack.append(path + [nbr])\n    return []\n\ndef run():\n    \"\"\"Render the campus navigator interface comparing BFS and DFS traversal.\"\"\"\n    st.markdown('<div class=\"campus-card\">'\n                '<div class=\"card-title\">\ud83e\udded Practical 3: Campus Route Navigator</div>'\n                '<div class=\"card-subtitle\">Graph Search Traversal: Breadth-First Search vs Depth-First Search</div>',\n                unsafe_allow_html=True)\n    nodes = list(GRAPH.keys())\n    c1, c2, c3 = st.columns([1, 1, 1])\n    start = c1.selectbox(\"Start Location\", nodes, index=0)\n    goal = c2.selectbox(\"Goal Location\", nodes, index=3)\n    algo = c3.radio(\"Search Strategy\", [\"BFS (Shortest)\", \"DFS (Depth-First)\"])\n    find = st.button(\"Find Route\", type=\"primary\")\n    st.markdown('</div>', unsafe_allow_html=True)\n\n    if find or \"nav_path\" in st.session_state:\n        if find:\n            st.session_state.nav_path = bfs(start, goal) if \"BFS\" in algo else dfs(start, goal)\n            st.session_state.nav_algo = algo\n        path = st.session_state.get(\"nav_path\", [])\n        st.markdown(f'<div class=\"campus-card\"><div class=\"card-title\">\ud83d\udccd Path Result: {st.session_state.get(\"nav_algo\", \"\")}</div>', unsafe_allow_html=True)\n        if path:\n            chips = \" \".join(f'<span class=\"chip chip-indigo\">{node}</span>' + ('<span class=\"arrow-separator\">\u2794</span>' if i < len(path)-1 else '') for i, node in enumerate(path))\n            st.markdown(f'<div class=\"route-container\">{chips}</div>', unsafe_allow_html=True)\n            st.write(f\"\u2728 **Total Steps:** `{len(path) - 1} hops` ({len(path)} landmarks visited)\")\n        else:\n            st.markdown('<span class=\"chip chip-amber\">\u26a0\ufe0f No path found between selected locations</span>', unsafe_allow_html=True)\n        st.markdown('</div>', unsafe_allow_html=True)\n", "modules/game_zone.py": "import streamlit as st\nimport heapq\n\nGOAL = (1, 2, 3, 4, 5, 6, 7, 8, 0)\nLINES = [(0,1,2), (3,4,5), (6,7,8), (0,3,6), (1,4,7), (2,5,8), (0,4,8), (2,4,6)]\n\ndef a_star_hint(state: tuple) -> str:\n    \"\"\"Compute the next optimal move for 8-puzzle using A* with Manhattan distance.\"\"\"\n    pos = {v: (i // 3, i % 3) for i, v in enumerate(GOAL)}\n    h = lambda s: sum(abs(i // 3 - pos[v][0]) + abs(i % 3 - pos[v][1]) for i, v in enumerate(s) if v)\n    pq, visited = [(h(state), 0, state, [])], {state: 0}\n    while pq:\n        _, g, s, path = heapq.heappop(pq)\n        if s == GOAL:\n            return f\"Slide Tile {path[0][0]} {path[0][1]}\" if path else \"Puzzle Solved!\"\n        idx = s.index(0)\n        r, c = idx // 3, idx % 3\n        for dr, dc, m in [(-1,0,\"Down\"), (1,0,\"Up\"), (0,-1,\"Right\"), (0,1,\"Left\")]:\n            nr, nc = r + dr, c + dc\n            if 0 <= nr < 3 and 0 <= nc < 3:\n                nidx = nr * 3 + nc\n                ns = list(s)\n                ns[idx], ns[nidx] = ns[nidx], ns[idx]\n                t = tuple(ns)\n                if t not in visited or g + 1 < visited[t]:\n                    visited[t] = g + 1\n                    heapq.heappush(pq, (g + 1 + h(t), g + 1, t, path + [(s[nidx], m)]))\n    return \"No solution found.\"\n\ndef minimax(b: list, is_ai: bool) -> int:\n    \"\"\"Evaluate game tree states recursively with Minimax for Tic-Tac-Toe.\"\"\"\n    if any(all(b[i] == 'O' for i in ln) for ln in LINES): return 10\n    if any(all(b[i] == 'X' for i in ln) for ln in LINES): return -10\n    if ' ' not in b: return 0\n    scores = [minimax(b[:i] + ['O' if is_ai else 'X'] + b[i+1:], not is_ai) for i in range(9) if b[i] == ' ']\n    return max(scores) if is_ai else min(scores)\n\ndef ai_move(b: list) -> int:\n    \"\"\"Determine the optimal move index for the AI player using Minimax.\"\"\"\n    moves = [(minimax(b[:i] + ['O'] + b[i+1:], False), i) for i in range(9) if b[i] == ' ']\n    return max(moves)[1] if moves else -1\n\ndef run():\n    \"\"\"Render the Game Zone featuring 8-puzzle (A*) and Tic-Tac-Toe (Minimax).\"\"\"\n    c_puz, c_ttt = st.columns(2)\n    with c_puz:\n        st.markdown('<div class=\"campus-card\"><div class=\"card-title\">\ud83e\udde9 Practical 4: 8-Puzzle (A* Search)</div>'\n                    '<div class=\"card-subtitle\">Heuristic: Manhattan Distance</div>', unsafe_allow_html=True)\n        if \"puzzle_s\" not in st.session_state: st.session_state.puzzle_s = (1, 2, 3, 4, 0, 5, 7, 8, 6)\n        s = st.session_state.puzzle_s\n        for r in range(3):\n            cols = st.columns(3)\n            for c in range(3):\n                v = s[r * 3 + c]\n                cols[c].markdown(f'<div class=\"{\"tile-box\" if v else \"tile-empty\"}\">{v if v else \"\"}</div>', unsafe_allow_html=True)\n        h1, h2 = st.columns(2)\n        if h1.button(\"\ud83d\udca1 Hint (A*)\", type=\"primary\"):\n            st.markdown(f'<span class=\"chip chip-teal\">\u25cf {a_star_hint(s)}</span>', unsafe_allow_html=True)\n        if h2.button(\"\ud83d\udd04 Reset Puzzle\"):\n            st.session_state.puzzle_s = (1, 2, 3, 4, 0, 5, 7, 8, 6)\n            st.rerun()\n        st.markdown('</div>', unsafe_allow_html=True)\n\n    with c_ttt:\n        st.markdown('<div class=\"campus-card\"><div class=\"card-title\">\u2b55 Practical 5: Tic-Tac-Toe (Minimax)</div>'\n                    '<div class=\"card-subtitle\">Unbeatable AI: You (X) vs AI (O)</div>', unsafe_allow_html=True)\n        if \"ttt_b\" not in st.session_state: st.session_state.ttt_b = [' '] * 9\n        b = st.session_state.ttt_b\n        winner = 'O' if any(all(b[i]=='O' for i in ln) for ln in LINES) else ('X' if any(all(b[i]=='X' for i in ln) for ln in LINES) else ('Draw' if ' ' not in b else None))\n        for r in range(3):\n            cols = st.columns(3)\n            for c in range(3):\n                i = r * 3 + c\n                if cols[c].button(b[i], key=f\"t_{i}\", disabled=(b[i] != ' ' or winner is not None)):\n                    b[i] = 'X'\n                    if not any(all(b[k]=='X' for k in ln) for ln in LINES) and ' ' in b:\n                        m = ai_move(b)\n                        if m != -1: b[m] = 'O'\n                    st.rerun()\n        status = '<span class=\"chip chip-red\">\u25cf AI Won!</span>' if winner == 'O' else ('<span class=\"chip chip-amber\">\u25cf Draw Game!</span>' if winner == 'Draw' else '<span class=\"chip chip-indigo\">\u25cf Status: AI ready (Your turn X)</span>')\n        st.markdown(status, unsafe_allow_html=True)\n        if st.button(\"\ud83d\udd04 Reset Game\"):\n            st.session_state.ttt_b = [' '] * 9\n            st.rerun()\n        st.markdown('</div>', unsafe_allow_html=True)\n", "modules/comfort.py": "import streamlit as st\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport skfuzzy as fuzz\nfrom skfuzzy import control as ctrl\nfrom sklearn.neural_network import MLPRegressor\nimport warnings\nwarnings.filterwarnings('ignore')\n\n@st.cache_resource\ndef get_fuzzy_sim():\n    \"\"\"Build and return the scikit-fuzzy Mamdani ControlSystemSimulation.\"\"\"\n    t, h, f = ctrl.Antecedent(np.arange(0, 51, 1), 't'), ctrl.Antecedent(np.arange(0, 101, 1), 'h'), ctrl.Consequent(np.arange(0, 101, 1), 'f')\n    t['l'], t['m'], t['h'] = fuzz.trimf(t.universe, [0, 0, 25]), fuzz.trimf(t.universe, [15, 25, 35]), fuzz.trimf(t.universe, [25, 50, 50])\n    h['l'], h['m'], h['h'] = fuzz.trimf(h.universe, [0, 0, 50]), fuzz.trimf(h.universe, [25, 50, 75]), fuzz.trimf(h.universe, [50, 100, 100])\n    f['l'], f['m'], f['h'] = fuzz.trimf(f.universe, [0, 0, 45]), fuzz.trimf(f.universe, [30, 55, 80]), fuzz.trimf(f.universe, [60, 100, 100])\n    sys = ctrl.ControlSystem([ctrl.Rule(t['h'] | h['h'], f['h']), ctrl.Rule(t['m'] | h['m'], f['m']), ctrl.Rule(t['l'] | h['l'], f['l'])])\n    return ctrl.ControlSystemSimulation(sys)\n\ndef compute_sugeno(t: float, h: float) -> float:\n    \"\"\"Calculate fan speed using Sugeno weighted average method.\"\"\"\n    wl, wm, wh = max(0.0, 1 - t/25) * max(0.0, 1 - h/50), max(0.0, 1 - abs(t-25)/15), max(0.0, (t-20)/30) * max(0.0, (h-40)/60)\n    return (wl * 15.0 + wm * 55.0 + wh * 90.0) / (wl + wm + wh + 1e-5)\n\ndef compute_mamdani(t: float, h: float) -> float:\n    \"\"\"Evaluate fan speed through Mamdani fuzzy centroid defuzzification.\"\"\"\n    try:\n        sim = get_fuzzy_sim()\n        sim.input['t'], sim.input['h'] = float(np.clip(t, 1, 49)), float(np.clip(h, 1, 99))\n        sim.compute()\n        return float(sim.output['f'])\n    except Exception:\n        return compute_sugeno(t, h)\n\n@st.cache_resource\ndef get_trained_mlp():\n    \"\"\"Train and cache an MLPRegressor on fuzzy rule grid samples.\"\"\"\n    T, H = np.meshgrid(np.linspace(5, 45, 12), np.linspace(10, 90, 12))\n    X = np.column_stack([T.ravel(), H.ravel()])\n    Y = np.clip(1.25 * X[:, 0] + 0.45 * X[:, 1] - 12, 10, 95)\n    mlp = MLPRegressor(hidden_layer_sizes=(8, 4), solver='lbfgs', max_iter=150, random_state=42)\n    mlp.fit(X, Y)\n    return mlp\n\ndef run():\n    \"\"\"Render the Comfort Control screen with Fuzzy Mamdani/Sugeno and MLP neuro-fuzzy.\"\"\"\n    st.markdown('<div class=\"campus-card\"><div class=\"card-title\">\u2744\ufe0f Practicals 6 & 7: Fuzzy Comfort Control</div>'\n                '<div class=\"card-subtitle\">Mamdani Defuzzification vs Sugeno Weighted Average</div>', unsafe_allow_html=True)\n    col_in, col_gauge = st.columns([2, 1])\n    with col_in:\n        temp = st.slider(\"\ud83c\udf21\ufe0f Room Temperature (\u00b0C)\", 0, 50, 28)\n        hum = st.slider(\"\ud83d\udca7 Relative Humidity (%)\", 0, 100, 65)\n        mode = st.radio(\"Inference Strategy\", [\"Mamdani (Fuzzy Centroid)\", \"Sugeno (Weighted Average)\"], horizontal=True)\n        fan_speed = compute_mamdani(temp, hum) if \"Mamdani\" in mode else compute_sugeno(temp, hum)\n    with col_gauge:\n        st.markdown(f'<div class=\"gauge-card\"><div style=\"color:#64748B; font-weight:600; font-size:0.85rem;\">PREDICTED FAN SPEED</div>'\n                    f'<div class=\"gauge-val\">{fan_speed:.1f}%</div><span class=\"chip chip-teal\">\u25cf Active: {mode.split()[0]}</span></div>', unsafe_allow_html=True)\n    st.markdown('</div>', unsafe_allow_html=True)\n\n    st.markdown('<div class=\"campus-card\"><div class=\"card-title\">\ud83e\udde0 Practical 8: Neuro-Fuzzy (MLP Regressor Comparison)</div>'\n                '<div class=\"card-subtitle\">Comparing scikit-learn MLP predictions against Fuzzy logic across temperatures</div>', unsafe_allow_html=True)\n    mlp = get_trained_mlp()\n    mlp_val = float(mlp.predict([[temp, hum]])[0])\n    st.write(f\"\ud83d\udcca **At {temp}\u00b0C & {hum}% Humidity:** Fuzzy Output = `{fan_speed:.1f}%` | MLP Neural Net Output = `{mlp_val:.1f}%`\")\n    t_range = np.linspace(10, 45, 25)\n    f_curve = [compute_mamdani(ti, hum) for ti in t_range]\n    mlp_curve = mlp.predict(np.column_stack([t_range, np.full_like(t_range, hum)]))\n    fig, ax = plt.subplots(figsize=(7, 2.3))\n    ax.plot(t_range, f_curve, label=\"Fuzzy Output\", color=\"#4F46E5\", linewidth=2.5)\n    ax.plot(t_range, mlp_curve, label=\"MLP Neuro-Fuzzy\", color=\"#14B8A6\", linestyle=\"--\", linewidth=2)\n    ax.axvline(temp, color=\"#F59E0B\", linestyle=\":\", label=f\"Current Temp ({temp}\u00b0C)\")\n    ax.set_xlabel(\"Temperature (\u00b0C)\", fontsize=9); ax.set_ylabel(\"Fan Speed (%)\", fontsize=9); ax.legend(fontsize=8, loc=\"upper left\")\n    ax.grid(True, linestyle=\"--\", alpha=0.3)\n    st.pyplot(fig)\n    plt.close(fig)\n    st.markdown('</div>', unsafe_allow_html=True)\n", "modules/insights.py": "import streamlit as st\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom collections import defaultdict, Counter\nfrom sklearn.linear_model import Perceptron\n\nFAQS = [\n    \"where is the campus library located\", \"how to register for placement cell drives\",\n    \"what is the minimum attendance requirement for exams\", \"how to check semester marks and grades\",\n    \"where can students submit course assignments\", \"canteen lunch hours are from twelve to two\",\n    \"how to pay semester hostel fees online\", \"where is the admin block and accounts desk\",\n    \"when will semester exam dates be announced\", \"how to contact faculty advisor and mentor\",\n    \"library timings are eight am to eight pm\", \"placement cell organizes mock interviews next week\",\n    \"what is the attendance policy for scholarship\", \"canteen offers fresh food and snacks daily\",\n    \"how to access online study materials and notes\", \"laboratory practical exams start next monday morning\",\n    \"where to submit scholarship application forms\", \"how to apply for campus bus pass\",\n    \"what is the passing marks for end term exams\", \"annual technical and cultural festival begins next month\"\n]\n\n@st.cache_data\ndef get_student_sample_data() -> tuple[np.ndarray, np.ndarray]:\n    \"\"\"Generate 30 synthetic student records with attendance, marks, and assignments.\"\"\"\n    np.random.seed(42)\n    att = np.random.randint(45, 98, 30)\n    marks = np.random.randint(40, 95, 30)\n    assgn = np.random.randint(2, 11, 30)\n    X = np.column_stack([att, marks, assgn])\n    y = ((att >= 75) & (marks >= 50) & (assgn >= 5)).astype(int)\n    return X, y\n\ndef train_perceptron(X: np.ndarray, y: np.ndarray) -> Perceptron:\n    \"\"\"Train a Perceptron classifier to detect at-risk vs safe academic status.\"\"\"\n    return Perceptron(max_iter=100, random_state=42).fit(X, y)\n\ndef run_competitive_learning(X: np.ndarray) -> tuple[np.ndarray, np.ndarray]:\n    \"\"\"Cluster 30 students into 3 cohorts via unsupervised competitive learning.\"\"\"\n    W = np.array([[55.0, 50.0, 3.0], [75.0, 70.0, 6.0], [90.0, 88.0, 9.0]])\n    for _ in range(15):\n        for row in X:\n            W[np.argmin(np.linalg.norm(W - row, axis=1))] += 0.15 * (row - W[np.argmin(np.linalg.norm(W - row, axis=1))])\n    clusters = np.array([np.argmin(np.linalg.norm(W - row, axis=1)) for row in X])\n    return clusters, W\n\ndef get_ngram_suggestions(text: str) -> list[str]:\n    \"\"\"Predict top 3 next words using bigram and trigram frequency counts on campus FAQs.\"\"\"\n    bigrams, trigrams = defaultdict(Counter), defaultdict(Counter)\n    for s in FAQS:\n        words = s.lower().split()\n        for i in range(len(words)-1): bigrams[words[i]][words[i+1]] += 1\n        for i in range(len(words)-2): trigrams[(words[i], words[i+1])][words[i+2]] += 1\n    w = text.lower().strip().split()\n    preds = [word for word, _ in trigrams.get((w[-2], w[-1]), Counter()).most_common(3)] if len(w) >= 2 else []\n    if len(preds) < 3 and len(w) >= 1:\n        for word, _ in bigrams.get(w[-1], Counter()).most_common(3):\n            if word not in preds: preds.append(word)\n    for default in [\"campus\", \"library\", \"exam\", \"fees\"]:\n        if len(preds) < 3 and default not in preds: preds.append(default)\n    return preds[:3]\n\ndef run():\n    \"\"\"Render Student Insights covering Perceptron risk, competitive clustering, and N-gram FAQ chat.\"\"\"\n    X, y = get_student_sample_data()\n    perceptron = train_perceptron(X, y)\n    clusters, W = run_competitive_learning(X)\n\n    st.markdown('<div class=\"campus-card\"><div class=\"card-title\">\ud83d\udcca Practical 9: Academic Risk (Perceptron) & Clustering</div>'\n                '<div class=\"card-subtitle\">Supervised Perceptron Classifier + Unsupervised Competitive Learning (3 Clusters)</div>', unsafe_allow_html=True)\n    c_in, c_plot = st.columns([1, 1.3])\n    with c_in:\n        att = st.slider(\"Attendance (%)\", 0, 100, 78)\n        marks = st.slider(\"Semester Marks (%)\", 0, 100, 68)\n        assgn = st.slider(\"Assignments Completed (0-10)\", 0, 10, 7)\n        if st.button(\"Predict Risk (Perceptron)\", type=\"primary\"):\n            pred = perceptron.predict([[att, marks, assgn]])[0]\n            st.session_state.risk_pred = \"Safe / Low Risk\" if pred == 1 else \"Action Required / At Risk\"\n            st.session_state.risk_color = \"chip-green\" if pred == 1 else \"chip-red\"\n        if \"risk_pred\" in st.session_state:\n            st.markdown(f'<span class=\"chip {st.session_state.risk_color}\">\u25cf Result: {st.session_state.risk_pred}</span>', unsafe_allow_html=True)\n    with c_plot:\n        fig, ax = plt.subplots(figsize=(4.8, 3.2))\n        colors = [\"#4F46E5\", \"#14B8A6\", \"#F59E0B\"]\n        labels = [\"Needs Support\", \"Average\", \"High Achievers\"]\n        for k in range(3):\n            pts = X[clusters == k]\n            ax.scatter(pts[:, 0], pts[:, 1], c=colors[k], label=labels[k], alpha=0.8, s=45)\n            ax.scatter(W[k, 0], W[k, 1], c=colors[k], marker=\"*\", s=160, edgecolor=\"black\")\n        ax.scatter([att], [marks], c=\"red\", marker=\"X\", s=110, label=\"Current Input\")\n        ax.set_xlabel(\"Attendance (%)\", fontsize=8); ax.set_ylabel(\"Marks (%)\", fontsize=8)\n        ax.legend(fontsize=7, loc=\"lower right\"); ax.grid(True, linestyle=\"--\", alpha=0.3)\n        st.pyplot(fig)\n        plt.close(fig)\n    st.markdown('</div>', unsafe_allow_html=True)\n\n    st.markdown('<div class=\"campus-card\"><div class=\"card-title\">\ud83d\udcac Practical 10: Campus FAQ Chat (Bigram / Trigram NLP)</div>'\n                '<div class=\"card-subtitle\">Statistical language modeling predicts the next word based on 20 campus FAQ sentences</div>', unsafe_allow_html=True)\n    query = st.text_input(\"Ask CampusMind a question (try: 'where is the' or 'how to'):\", value=\"where is the\")\n    next_words = get_ngram_suggestions(query)\n    chips_html = \" \".join([f'<span class=\"chip chip-indigo\">\ud83d\udca1 {w}</span>' for w in next_words])\n    st.markdown(f'<div><b>Next-Word Suggestions:</b> {chips_html}</div>', unsafe_allow_html=True)\n    st.markdown('</div>', unsafe_allow_html=True)\n"};

    try {
      if (statusEl) statusEl.innerText = "Loading AI models & Streamlit runtime...";

      mount({
        requirements: ["networkx", "scikit-fuzzy", "scikit-learn", "matplotlib", "pandas", "numpy", "scipy"],

      // Fade out loading screen once stlite mounts

          if (loaderEl) {
            loaderEl.style.opacity = "0";
            setTimeout(() => loaderEl.remove(), 400);
          }
          obs.disconnect();
        }
      });
      observer.observe(document.getElementById("root"), { childList: true, subtree: true });

      // Safety timeout to dismiss loading card if observer misses class
      setTimeout(() => {
        if (loaderEl) {
          loaderEl.style.opacity = "0";
          setTimeout(() => loaderEl.remove(), 400);
        }
      }, 12000);

    } catch (err) {
